name: Deploy to Contabo

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            set -e
            cd /opt/terrarisk-workshop/terrarisk-workshop
            git stash --include-untracked
            git pull origin master
            # Ensure .env exists (not tracked in git)
            if [ ! -f .env ]; then
              echo "PYTHONUNBUFFERED=1" > .env
              echo "ENVIRONMENT=production" >> .env
              echo "NEXT_PUBLIC_API_URL=http://api:8000" >> .env
              echo "NODE_ENV=production" >> .env
              echo "ADMIN_API_KEY=terrarisk-admin-2026" >> .env
            fi
            echo "Building images..."
            docker compose -f docker-compose.prod.yml build
            echo "Build OK — deploying..."
            docker compose -f docker-compose.prod.yml up -d
            sleep 10
            echo "Running health checks..."
            curl -sf http://localhost:8002/api/health || { echo "API health check failed"; exit 1; }
            curl -sf http://localhost:4001 || { echo "Frontend health check failed"; exit 1; }
            echo "Deploy exitoso"
